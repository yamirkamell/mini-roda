# Docker Compose configuration for using cloud services
# This file demonstrates how to use cloud databases instead of local PostgreSQL
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d
#
# Make sure to set these environment variables:
#   DATABASE_URL_CUSTOMERS=postgresql://user:password@cloud-host:5432/customers_db?sslmode=require
#   DATABASE_URL_LOANS=postgresql://user:password@cloud-host:5432/loans_db?sslmode=require

version: '3.8'

services:
  # Override postgres service to disable it when using cloud databases
  postgres:
    profiles:
      - local-db  # Only start if explicitly requested
    image: postgres:15-alpine
    container_name: mini-roda-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: customers_db
      POSTGRES_MULTIPLE_DATABASES: customers_db,loans_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/gateway/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    networks:
      - mini-roda-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Customers Service - Using cloud database
  customers-service:
    environment:
      # Use cloud database URL from environment variable
      DATABASE_URL: ${DATABASE_URL_CUSTOMERS}
      PORT: 8001
      API_TITLE: "Customers Service (Cloud)"
      API_VERSION: "1.0.0"
      CORS_ORIGINS: "*"
    depends_on:
      - traefik
    # Remove dependency on local postgres
    # depends_on:
    #   - postgres

  # Loans Service - Using cloud database
  loans-service:
    environment:
      # Use cloud database URL from environment variable
      DATABASE_URL: ${DATABASE_URL_LOANS}
      PORT: 8002
      API_TITLE: "Loans Service (Cloud)"
      API_VERSION: "1.0.0"
      CORS_ORIGINS: "*"
    depends_on:
      - traefik
    # Remove dependency on local postgres
    # depends_on:
    #   - postgres

volumes:
  postgres-data:
    # Only create if using local database
    external: false

networks:
  mini-roda-network:
    external: false

