apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfe-loans
  namespace: roda
  labels:
    app: mfe-loans
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mfe-loans
  template:
    metadata:
      labels:
        app: mfe-loans
        version: v1
    spec:
      containers:
      - name: mfe-loans
        image: mini-roda/mfe-loans:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5174
          protocol: TCP
        env:
        - name: VITE_API_BASE_URL
          value: "http://localhost"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mfe-loans
  namespace: roda
  labels:
    app: mfe-loans
spec:
  type: ClusterIP
  ports:
  - port: 5174
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: mfe-loans
