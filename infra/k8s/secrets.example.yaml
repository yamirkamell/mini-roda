apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: roda
type: Opaque
stringData:
  # PostgreSQL connection URL (from Neon/Supabase)
  # Ejemplo para Neon:
  # DATABASE_URL_CUSTOMERS: "postgresql://user:password@ep-xxx-xxx.us-east-1.aws.neon.tech/customers_db?sslmode=require"
  # Ejemplo para Supabase:
  # DATABASE_URL_CUSTOMERS: "postgresql://postgres:password@db.xxx.supabase.co:5432/postgres"
  DATABASE_URL_CUSTOMERS: "postgresql://user:password@host:5432/customers_db"
  DATABASE_URL_LOANS: "postgresql://user:password@host:5432/loans_db"
  
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: roda
type: Opaque
stringData:
  # Add any other secrets here
  API_KEY: "your-api-key-here"


