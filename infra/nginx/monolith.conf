server {
    listen 3000;
    server_name _;

    # Headers comunes
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Shell host
    root /app/frontend/shell;
    index index.html;

    # Shell SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # MFE Customers
    location /customers/ {
        alias /app/frontend/mfe-customers/;
        try_files $uri $uri/ /index.html;
    }

    # MFE Loans
    location /loans/ {
        alias /app/frontend/mfe-loans/;
        try_files $uri $uri/ /index.html;
    }

    # API Customers
    location /api/v1/customers/ {
        proxy_pass http://127.0.0.1:8001/;
        include /etc/nginx/proxy_params;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_read_timeout 300;
    }

    # API Loans
    location /api/v1/loans/ {
        proxy_pass http://127.0.0.1:8002/;
        include /etc/nginx/proxy_params;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_read_timeout 300;
    }

    # Salud rápida
    location /healthz {
        add_header Content-Type text/plain;
        return 200 ok;
    }
}

