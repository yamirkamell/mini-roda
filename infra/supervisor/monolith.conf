[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[program:customers-service]
command=/usr/local/bin/uvicorn app.main:app --host 0.0.0.0 --port 8001
directory=/app/apps/customers-service
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/customers.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PYTHONPATH="/app/apps/customers-service",DATABASE_URL="%(ENV_CUSTOMERS_DATABASE_URL)s"

[program:loans-service]
command=/usr/local/bin/uvicorn app.main:app --host 0.0.0.0 --port 8002
directory=/app/apps/loans-service
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/loans.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PYTHONPATH="/app/apps/loans-service",DATABASE_URL="%(ENV_LOANS_DATABASE_URL)s"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

