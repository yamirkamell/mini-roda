# Render Blueprint para despliegue completo
# https://render.com/docs/blueprint-spec

services:
  # PostgreSQL Database
  - type: pg
    name: mini-roda-db
    plan: free
    databaseName: mini_roda
    user: mini_roda_user

  # Customers Service
  - type: web
    name: customers-service
    env: docker
    dockerfilePath: ./apps/customers-service/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-roda-db
          property: connectionString
      - key: PORT
        value: 8001
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health

  # Loans Service
  - type: web
    name: loans-service
    env: docker
    dockerfilePath: ./apps/loans-service/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-roda-db
          property: connectionString
      - key: PORT
        value: 8002
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health

  # MFE Customers
  - type: web
    name: mfe-customers
    env: docker
    dockerfilePath: ./apps/mfe-customers/Dockerfile
    dockerContext: .
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mfe-customers.onrender.com
    healthCheckPath: /

  # MFE Loans
  - type: web
    name: mfe-loans
    env: docker
    dockerfilePath: ./apps/mfe-loans/Dockerfile
    dockerContext: .
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mfe-loans.onrender.com
    healthCheckPath: /

