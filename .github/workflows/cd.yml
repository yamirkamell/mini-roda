name: CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.prettierrc'
      - '.prettierignore'
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/mini-roda
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            apps/*/__pycache__
            apps/*/.pytest_cache
          key: ${{ runner.os }}-python-${{ hashFiles('apps/*/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/customers-service/requirements.txt
          pip install -r apps/loans-service/requirements.txt

      - name: Lint JavaScript/TypeScript
        run: pnpm lint

      - name: Lint Python (customers-service)
        run: |
          cd apps/customers-service
          pnpm lint || true

      - name: Lint Python (loans-service)
        run: |
          cd apps/loans-service
          pnpm lint || true

      - name: Test JavaScript/TypeScript
        run: pnpm test || echo "No JS tests configured"
        continue-on-error: true

      - name: Test Python (customers-service)
        working-directory: apps/customers-service
        run: pytest tests/ -v || echo "Tests skipped"
        continue-on-error: true

      - name: Test Python (loans-service)
        working-directory: apps/loans-service
        run: pytest tests/ -v || echo "Tests skipped"
        continue-on-error: true

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: customers-service
            dockerfile: apps/customers-service/Dockerfile
            context: .
          - name: loans-service
            dockerfile: apps/loans-service/Dockerfile
            context: .
          - name: mfe-customers
            dockerfile: apps/mfe-customers/Dockerfile
            context: .
          - name: mfe-loans
            dockerfile: apps/mfe-loans/Dockerfile
            context: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-cluster-url.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.1.1'

      - name: Update image tags in Kubernetes manifests
        run: |
          cd infra/k8s
          # Update image tags using kustomize
          kustomize edit set image \
            mini-roda/customers-service=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/customers-service:main-${{ github.sha }}
          
          kustomize edit set image \
            mini-roda/loans-service=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/loans-service:main-${{ github.sha }}
          
          kustomize edit set image \
            mini-roda/mfe-customers=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mfe-customers:main-${{ github.sha }}
          
          kustomize edit set image \
            mini-roda/mfe-loans=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mfe-loans:main-${{ github.sha }}

      - name: Set up Kubernetes context
        if: secrets.KUBECONFIG != ''
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          kubectl config set-context --current --namespace=roda || true
        continue-on-error: true

      - name: Apply Kubernetes manifests
        if: secrets.KUBECONFIG != ''
        run: |
          kubectl apply -k infra/k8s
        continue-on-error: true

      - name: Verify deployment
        if: secrets.KUBECONFIG != ''
        run: |
          kubectl rollout status deployment/customers-service -n roda --timeout=5m || true
          kubectl rollout status deployment/loans-service -n roda --timeout=5m || true
          kubectl rollout status deployment/mfe-customers -n roda --timeout=5m || true
          kubectl rollout status deployment/mfe-loans -n roda --timeout=5m || true
        continue-on-error: true

      - name: Get deployment status
        if: secrets.KUBECONFIG != ''
        run: |
          kubectl get pods -n roda || true
          kubectl get services -n roda || true
          kubectl get ingressroute -n roda || true
        continue-on-error: true

