name: Cloud Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/mini-roda

jobs:
  deploy-to-cloud:
    name: Deploy to Cloud Environment
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/customers-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/loans-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mfe-customers:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mfe-loans:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify cloud database connection
        env:
          DATABASE_URL_CUSTOMERS: ${{ secrets.DATABASE_URL_CUSTOMERS }}
          DATABASE_URL_LOANS: ${{ secrets.DATABASE_URL_LOANS }}
        run: |
          echo "Verifying cloud database connections..."
          # This would run actual connection tests if psql is available
          echo "Cloud database URLs configured"
          echo "Customers DB: ${DATABASE_URL_CUSTOMERS:0:50}..."
          echo "Loans DB: ${DATABASE_URL_LOANS:0:50}..."

      - name: Deploy notification
        run: |
          echo "🚀 Deployment to ${{ github.event.inputs.environment }} initiated"
          echo "📦 Images pushed to ${{ env.REGISTRY }}"
          echo "🔗 Using cloud database services"

