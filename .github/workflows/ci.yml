name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Lint JavaScript/TypeScript
        run: pnpm lint
        continue-on-error: true
      
      - name: Format check
        run: pnpm format --check || true

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/customers-service/requirements.txt
          pip install -r apps/loans-service/requirements.txt
          pip install ruff black mypy
      
      - name: Lint customers-service
        working-directory: apps/customers-service
        run: |
          ruff check . || echo "Ruff check completed with warnings"
          black --check . || echo "Black check completed with warnings"
      
      - name: Lint loans-service
        working-directory: apps/loans-service
        run: |
          ruff check . || echo "Ruff check completed with warnings"
          black --check . || echo "Black check completed with warnings"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/customers-service/requirements.txt
          pip install -r apps/loans-service/requirements.txt
      
      - name: Run migrations (customers-service)
        working-directory: apps/customers-service
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_customers_db
        run: |
          # Create test database
          PGPASSWORD=password psql -h localhost -U user -d postgres -c "CREATE DATABASE test_customers_db;" || true
          alembic upgrade head || echo "Migrations completed"
      
      - name: Run migrations (loans-service)
        working-directory: apps/loans-service
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_loans_db
        run: |
          # Create test database
          PGPASSWORD=password psql -h localhost -U user -d postgres -c "CREATE DATABASE test_loans_db;" || true
          alembic upgrade head || echo "Migrations completed"
      
      - name: Run tests (customers-service)
        working-directory: apps/customers-service
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_customers_db
        run: |
          pytest tests/ -v --cov=app --cov-report=xml || echo "Tests completed"
        continue-on-error: true
      
      - name: Run tests (loans-service)
        working-directory: apps/loans-service
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_loans_db
        run: |
          pytest tests/ -v --cov=app --cov-report=xml || echo "Tests completed"
        continue-on-error: true

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [lint-and-format, python-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r apps/customers-service/requirements.txt
          pip install -r apps/loans-service/requirements.txt
      
      - name: Build UI package
        run: |
          cd packages/ui
          pnpm build
      
      - name: Build microfrontends
        run: |
          pnpm --filter='./apps/mfe-*' build
      
      - name: Verify builds
        run: |
          ls -la packages/ui/dist/ || echo "UI build verification"
          ls -la apps/mfe-customers/dist/ || echo "MFE customers build verification"
          ls -la apps/mfe-loans/dist/ || echo "MFE loans build verification"

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build customers-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/customers-service/Dockerfile
          push: false
          tags: mini-roda/customers-service:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build loans-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/loans-service/Dockerfile
          push: false
          tags: mini-roda/loans-service:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build mfe-customers image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/mfe-customers/Dockerfile
          push: false
          tags: mini-roda/mfe-customers:ci-test
          build-args: |
            VITE_API_BASE_URL=http://localhost
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build mfe-loans image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/mfe-loans/Dockerfile
          push: false
          tags: mini-roda/mfe-loans:ci-test
          build-args: |
            VITE_API_BASE_URL=http://localhost
          cache-from: type=gha
          cache-to: type=gha,mode=max


