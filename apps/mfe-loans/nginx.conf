server {
    listen 5174;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Serve remoteEntry.js (Traefik strips /loans prefix)
    location = /remoteEntry.js {
        alias /usr/share/nginx/html/assets/remoteEntry.js;
        add_header Content-Type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve assets (Traefik strips /loans prefix)
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve CSS files from assets (Traefik strips /loans prefix)
    # Module Federation may request CSS files directly like /style-XXX.css
    # Map /style-XXX.css to /assets/style-XXX.css
    location ~ ^/style-(.+\.css)$ {
        alias /usr/share/nginx/html/assets/style-$1;
        add_header Content-Type text/css;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle /loans without trailing slash (when accessed directly, not through Traefik)
    location = /loans {
        return 301 $scheme://$host/loans/;
    }

    # Serve index.html and other files for /loans/ path (when accessed directly)
    location /loans/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Fallback for root access - serve index.html directly
    location / {
        try_files $uri $uri/ /index.html;
    }
}


